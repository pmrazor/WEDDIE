spring.datasource.hikari.jdbc-url=jdbc:mysql://localhost:3306/pjttest?serverTimezone=UTC&useUniCode=yes&characterEncoding=UTF-8
spring.datasource.hikari.username=root
spring.datasource.hikari.password=1234
