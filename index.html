<!DOCTYPE html>
<html>
  <head>
    <title>Todo List</title>
    <style>
      .header {
        background-color: silver;
      }
    </style>
  </head>
  <body>
    <!-- 공통 영역 - 의도적 충돌 유도 -->
    <div class="header">
      <!-- 두 팀 모두 이 영역을 수정하게 함 -->
      [이 부분을 수정하세요]
    </div>

    <!-- B팀 담당 영역 -->
    <div class="list-section">
      <h2>My Todo List</h2>
      <ul id="todoList">
      </ul>
      <input type="text" id="newTodo" placeholder="새로운 할 일을 입력하세요">
      <p>ㅎㅇㅎㅇ 김가현 써봄</p>
      <div>
        최수환작업
        <button id="addTodo">버튼하나</button>
        <button id="removeTodo">버튼둘</button>
        <a href="https://www.naver.com">네이버</a>
      </div>
    </div>

    <!-- A팀 담당 영역 -->
    <div class="footer">[A팀이 작성할 영역]</div>
  </body>
</html>
